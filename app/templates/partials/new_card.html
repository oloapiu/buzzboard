<div class="fixed inset-0 z-40 flex items-start justify-center bg-black/30 p-8"
     onclick="if (event.target === this) this.remove()">
  <div class="w-full max-w-lg rounded-lg bg-white p-6 shadow-xl">
    <h2 class="mb-4 font-semibold">New card</h2>
    <form hx-post="/cards" hx-target="#modal" hx-swap="innerHTML" class="space-y-3">
      <input type="hidden" name="repo" value="{{ repo }}">
      <input name="subject" required autofocus placeholder="Title"
             class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
      <textarea name="body" rows="5" placeholder="Description (markdown)"
                class="w-full rounded border border-slate-300 px-3 py-2 text-sm"></textarea>
      <input name="labels" placeholder="labels, comma-separated (e.g. bug, in-progress)"
             class="w-full rounded border border-slate-300 px-3 py-2 text-sm">
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="document.getElementById('modal').innerHTML = ''"
                class="rounded border border-slate-300 px-3 py-1.5 text-sm">Cancel</button>
        <button class="rounded bg-slate-800 px-4 py-1.5 text-sm text-white hover:bg-slate-700">Create</button>
      </div>
    </form>
  </div>
</div>
