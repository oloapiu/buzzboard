<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>buzzboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <header class="flex items-center justify-between border-b border-slate-200 bg-white px-4 py-2 shadow-sm">
    <div class="flex items-baseline gap-3">
      <h1 class="text-lg font-bold tracking-tight">buzzboard</h1>
      <span class="text-xs text-slate-400">issues on the buzz relay, as a board</span>
    </div>
    <div class="flex items-center gap-3 text-sm">
      {% if identity %}<span class="font-mono text-xs text-slate-400" title="{{ identity }}">{{ identity[:14] }}…</span>{% endif %}
      <a href="/settings" class="rounded border border-slate-300 px-3 py-1 hover:bg-slate-50">Settings</a>
    </div>
  </header>

  {% if configured %}
  <main id="board"
        hx-get="/partials/board"
        hx-trigger="load, every 5s [boardIdle()], refresh from:body"
        hx-swap="innerHTML"
        class="p-4">
    <div class="p-8 text-center text-slate-400">Loading board…</div>
  </main>
  {% else %}
  <main class="mx-auto mt-16 max-w-lg rounded-lg border border-slate-200 bg-white p-8 text-center shadow-sm">
    <p class="mb-4 text-slate-600">Not configured yet — set a relay URL and private key to load the board.</p>
    <a href="/settings" class="rounded bg-slate-800 px-4 py-2 text-white hover:bg-slate-700">Open settings</a>
  </main>
  {% endif %}

  <div id="modal"></div>

  <script>
    window._dragging = false;
    function boardIdle() {
      return !window._dragging && !document.getElementById('modal').firstElementChild;
    }
    function initBoard(root) {
      root.querySelectorAll('[data-cell]').forEach((el) => {
        new Sortable(el, {
          group: el.dataset.repo,
          animation: 120,
          ghostClass: 'opacity-40',
          onStart: () => { window._dragging = true; },
          onEnd: async (evt) => {
            window._dragging = false;
            const ids = [...evt.to.querySelectorAll('[data-card]')].map((c) => c.dataset.card);
            const body = new URLSearchParams({
              moved: evt.item.dataset.card,
              repo: evt.to.dataset.repo,
              column: evt.to.dataset.column,
              from_column: evt.from.dataset.column,
              ordered: ids.join(','),
            });
            const resp = await fetch('/cards/move', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body,
            });
            const text = await resp.text();
            if (text.trim()) document.getElementById('modal').innerHTML = text;
            htmx.trigger(document.body, 'refresh');
          },
        });
      });
    }
    document.body.addEventListener('htmx:afterSwap', (evt) => {
      if (evt.target.id === 'board') initBoard(evt.target);
    });
  </script>
</body>
</html>
